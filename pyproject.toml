[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wllm"
version = "0.0.1a0"
description = "wLLM: agent-operable deployment optimizer for AR, diffusion, video, world, and world-action models — verified automatic deployment synthesis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "wLLM contributors" }]
dependencies = ["pyyaml>=6.0"]

[project.scripts]
wllm = "wllm.control.cli:main"

[project.optional-dependencies]
torch = ["torch>=2.6", "safetensors"]
catalog = []               # manifest import is stdlib+pyyaml; runners resolve lazily
video = ["diffusers>=0.35", "transformers", "imageio", "imageio-ffmpeg"]
dev = ["pytest", "coverage"]

[tool.setuptools.packages.find]
include = ["wllm*"]

[tool.setuptools.package-data]
wllm = ["control/registry_data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["wllm/control", "wllm/composite", "wllm/techniques", "wllm/omni"]

[tool.coverage.report]
show_missing = true
