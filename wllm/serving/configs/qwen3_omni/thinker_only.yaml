# Single-stage AsyncOmni config for the Qwen3-Omni Thinker.
#
# Used by wllm/worker/qwen3_omni_worker.py to run the Thinker
# component in isolation. The Thinker emits text token IDs and the
# matching layer-0 / final-layer hidden states (engine_output_type=latent),
# which our worker then formats and forwards to a separate Talker
# AsyncOmni instance.
#
# Adapted from the engine's stock qwen3_omni_moe_async_chunk stage config
# (stage 0).

async_chunk: false
stage_args:
  - stage_id: 0
    stage_type: llm
    runtime:
      devices: "0"
    engine_args:
      model_stage: thinker
      max_num_seqs: 64
      model_arch: Qwen3OmniMoeForConditionalGeneration
      worker_type: ar
      scheduler_cls: __WLLM_OMNI_ENGINE__.core.sched.omni_ar_scheduler.OmniARScheduler
      gpu_memory_utilization: 0.5
      enforce_eager: false
      trust_remote_code: true
      engine_output_type: latent
      distributed_executor_backend: "mp"
      enable_prefix_caching: false
      max_num_batched_tokens: 32768
      hf_config_name: thinker_config
      tensor_parallel_size: 1
    final_output: true
    final_output_type: text
    is_comprehension: true
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      top_k: 1
      max_tokens: 2048
      seed: 42
      detokenize: True
      repetition_penalty: 1.05
