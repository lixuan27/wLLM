# Single-stage AsyncOmni config for the Qwen3-Omni Code2Wav (vocoder).
#
# Used by wllm/pipeline/qwen3_omni_pipeline.py to run the Code2Wav
# component in isolation. Inputs are 16-layer RVQ codec codes flattened
# in layer-major order and supplied as `prompt_token_ids`. Outputs are
# audio chunks streamed back as a list of waveforms.
#
# Differences vs. the engine's stock qwen3_omni_moe_async_chunk stage config
# stage 2:
#   - dropped `engine_input_source` and stage 1 connectors: this stage
#     stands alone and is fed by our orchestrator directly
#   - the codec_chunk_frames / codec_left_context_frames are still
#     applied at the connector level, but the orchestrator can also
#     pre-chunk if streaming is desired

async_chunk: false
stage_args:
  - stage_id: 0
    stage_type: llm
    runtime:
      devices: "0"
    engine_args:
      model_stage: code2wav
      max_num_seqs: 64
      model_arch: Qwen3OmniMoeForConditionalGeneration
      worker_type: generation
      scheduler_cls: __WLLM_OMNI_ENGINE__.core.sched.omni_generation_scheduler.OmniGenerationScheduler
      enforce_eager: true
      trust_remote_code: true
      async_scheduling: false
      enable_prefix_caching: false
      engine_output_type: audio
      gpu_memory_utilization: 0.1
      distributed_executor_backend: "mp"
      max_num_batched_tokens: 131072
      # The talker can emit up to `talker_max_tokens` codec frames; each
      # frame flattens into 16 token IDs at the code2wav prompt. With the
      # default talker_max_tokens=4096 that already saturates the model's
      # 65536 default max_model_len, so we bump it here to leave headroom
      # (and avoid `vllm.exceptions.VLLMValidationError: maximum context
      # length is 65536 ... requested 0 output tokens and your prompt
      # contains 65984 input tokens`).
      max_model_len: 131072
      hf_config_name: thinker_config
    final_output: true
    final_output_type: audio
    # Mark this stage as the comprehension stage so AsyncOmniEngine adds
    # "generate" to its supported_tasks. Without this, an audio-only
    # final stage publishes supported_tasks=("speech",), and the vLLM
    # InputProcessor rejects our SamplingParams with
    # "This model does not support generation". (See AsyncOmniEngine
    # line ~608: speech is added when final_output_type == "audio";
    # generate is only added when at least one stage is_comprehension.)
    is_comprehension: true
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      detokenize: True
      repetition_penalty: 1.1
