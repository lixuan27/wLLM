# Vendored from wllm/configs/qwen3_omni/thinker_only.yaml (read-only).
# Divergence: tensor_parallel_size 1 -> 2 and runtime.devices "0" -> "0,1"
# so the Thinker shards across 2 GPUs (within-one-request model
# parallelism to cut prefill + per-token decode latency). The worker
# exposes the two physical GPUs via streaming.thinker_visible_devices,
# so "0,1" here are the engine-relative indices of those two GPUs.

async_chunk: false
stage_args:
  - stage_id: 0
    stage_type: llm
    runtime:
      devices: "0,1"
    engine_args:
      model_stage: thinker
      max_num_seqs: 64
      model_arch: Qwen3OmniMoeForConditionalGeneration
      worker_type: ar
      scheduler_cls: vllm_omni.core.sched.omni_ar_scheduler.OmniARScheduler
      gpu_memory_utilization: 0.5
      enforce_eager: true
      trust_remote_code: true
      engine_output_type: latent
      distributed_executor_backend: "mp"
      disable_custom_all_reduce: true
      enable_prefix_caching: false
      max_num_batched_tokens: 32768
      hf_config_name: thinker_config
      tensor_parallel_size: 2
    final_output: true
    final_output_type: text
    is_comprehension: true
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      top_k: 1
      max_tokens: 2048
      seed: 42
      detokenize: True
      repetition_penalty: 1.05
