<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Qwen3-Omni · Text to Speech</title>
    <style>
      :root{
        --bg0:#070A12; --bg1:#0B1224;
        --text:#EAF2FF; --muted: rgba(234,242,255,0.68);
        --neon:#59FFF1; --neon2:#A78BFA; --warn:#FFB86B; --danger:#FF4D6D;
        --shadow: 0 20px 60px rgba(0,0,0,0.55); --radius: 18px;
      }
      *{ box-sizing:border-box; }
      html,body{ height:100%; }
      body{
        margin:0; color:var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
        background:
          radial-gradient(1200px 700px at 15% 10%, rgba(89,255,241,0.12), transparent 55%),
          radial-gradient(900px 600px at 85% 25%, rgba(167,139,250,0.14), transparent 55%),
          radial-gradient(900px 600px at 45% 110%, rgba(89,255,241,0.10), transparent 60%),
          linear-gradient(180deg, var(--bg0), var(--bg1));
        overflow-x:hidden;
      }
      .wrap{ max-width: 1040px; margin: 0 auto; padding: 32px 18px 40px; }
      .topbar{ display:flex; gap:16px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; margin-bottom:16px; }
      .title h1{ margin:0; font-size: 19px; letter-spacing: 0.3px; font-weight: 750; }
      .title .sub{ color: var(--muted); font-size: 13px; line-height: 1.5; margin-top:6px; max-width:560px; }
      .pill{
        display:inline-flex; align-items:center; gap:8px; padding: 10px 12px; border-radius: 999px;
        background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10); backdrop-filter: blur(10px);
      }
      .dot{ width:10px; height:10px; border-radius:50%; background: rgba(255,255,255,0.35); box-shadow: 0 0 0 4px rgba(255,255,255,0.08); }
      .dot.ok{ background: var(--neon); box-shadow: 0 0 0 4px rgba(89,255,241,0.14), 0 0 22px rgba(89,255,241,0.35); }
      .dot.warn{ background: var(--warn); box-shadow: 0 0 0 4px rgba(255,184,107,0.14), 0 0 22px rgba(255,184,107,0.30); }
      .dot.bad{ background: var(--danger); box-shadow: 0 0 0 4px rgba(255,77,109,0.14), 0 0 22px rgba(255,77,109,0.30); }
      .dot.spk{ background: var(--neon2); box-shadow: 0 0 0 4px rgba(167,139,250,0.16), 0 0 22px rgba(167,139,250,0.40); animation: pulse 1.1s ease-in-out infinite; }
      @keyframes pulse{ 0%,100%{ opacity:1 } 50%{ opacity:0.45 } }
      .stateText{ font-size: 13px; color: var(--muted); white-space:nowrap; }

      .grid{ display:grid; grid-template-columns: 1.25fr 1fr; gap: 16px; }
      @media (max-width: 900px){ .grid{ grid-template-columns: 1fr; } }
      .card{
        background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.045));
        border: 1px solid rgba(255,255,255,0.10); border-radius: var(--radius);
        box-shadow: var(--shadow); backdrop-filter: blur(12px); overflow:hidden; position:relative;
      }
      .card:before{
        content:""; position:absolute; inset:-1px;
        background: linear-gradient(90deg, rgba(89,255,241,0.22), rgba(167,139,250,0.18), rgba(89,255,241,0.16));
        opacity:0.35; filter: blur(18px); pointer-events:none;
      }
      .card > *{ position:relative; }
      .cardHeader{ padding: 14px 14px 10px; display:flex; align-items:center; justify-content:space-between; border-bottom: 1px solid rgba(255,255,255,0.08); }
      .cardHeader h2{ margin:0; font-size: 12.5px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(234,242,255,0.80); }
      .cardBody{ padding: 14px; }

      textarea{
        width:100%; min-height: 150px; resize: vertical; padding: 13px;
        border-radius: 14px; border: 1px solid rgba(255,255,255,0.14);
        background: rgba(0,0,0,0.28); color: var(--text); outline: none;
        font-family: inherit; font-size: 15px; line-height: 1.5;
      }
      textarea:focus{ border-color: rgba(89,255,241,0.30); box-shadow: 0 0 0 1px rgba(89,255,241,0.12); }
      textarea:disabled{ opacity:0.55; }

      .row{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
      .btn{
        appearance:none; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.06);
        color: var(--text); padding: 11px 16px; border-radius: 12px; font-weight: 650; letter-spacing:0.2px;
        cursor:pointer; transition: transform .08s ease, background .2s, border-color .2s, box-shadow .2s, opacity .2s; user-select:none;
      }
      .btn:hover{ background: rgba(255,255,255,0.09); border-color: rgba(89,255,241,0.22); box-shadow: 0 0 0 1px rgba(89,255,241,0.12), 0 0 24px rgba(89,255,241,0.10); }
      .btn:active{ transform: translateY(1px); }
      .btn:disabled{ opacity:0.45; cursor:not-allowed; box-shadow:none; }
      .btnPrimary{ border-color: rgba(89,255,241,0.30); box-shadow: 0 0 0 1px rgba(89,255,241,0.10), 0 0 30px rgba(89,255,241,0.10); }
      .chip{ padding: 8px 11px; font-size:12.5px; border-radius: 10px; }
      .muted{ color: var(--muted); font-size: 12.5px; }

      .message{ margin-top: 14px; min-height: 18px; font-size: 13.5px; line-height:1.5; color: var(--muted); }
      .message.error{ color: #FFD9E0; }
      .hint{ margin-top: 12px; color: rgba(234,242,255,0.55); font-size: 12.5px; }

      .metrics{ display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
      .metric{ padding: 12px; border-radius: 14px; background: rgba(0,0,0,0.22); border: 1px solid rgba(255,255,255,0.10); }
      .metric .k{ font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(234,242,255,0.62); margin-bottom: 6px; }
      .metric .v{ font-size: 17px; font-weight: 750; color: rgba(234,242,255,0.92); }
      .metric .v span{ font-size: 12px; font-weight: 650; color: rgba(234,242,255,0.70); }

      .logHeader{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:14px; }
      .logWrap{ margin-top: 10px; border-radius: 14px; background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.10); overflow:hidden; transition: max-height .25s ease, opacity .25s ease; max-height:0; opacity:0; }
      .logWrap.open{ max-height: 300px; opacity:1; }
      pre{ margin:0; padding: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; line-height: 1.45; color: rgba(89,255,241,0.92); height: 280px; overflow:auto; white-space: pre-wrap; word-break: break-word; }
    </style>
  </head>

  <body>
    <div class="wrap">
      <div class="topbar">
        <div class="title">
          <h1>Qwen3-Omni <span style="color:rgba(89,255,241,0.9)">·</span> Text to Speech</h1>
          <div class="sub">Type something and press Speak — you'll hear it read aloud as it's generated.</div>
        </div>
        <div class="pill">
          <div id="stateDot" class="dot"></div>
          <div id="state" class="stateText">connecting…</div>
        </div>
      </div>

      <div class="grid">
        <!-- Left: prompt -->
        <div class="card">
          <div class="cardHeader"><h2>Prompt</h2></div>
          <div class="cardBody">
            <textarea id="prompt" placeholder="Type what you'd like Qwen to say…" disabled></textarea>
            <div class="row" style="margin-top:12px;">
              <button id="btnStart" class="btn btnPrimary" disabled>Start</button>
              <button id="btnSpeak" class="btn btnPrimary" disabled>▶ Speak</button>
              <button id="btnStop" class="btn" disabled>■ Stop</button>
            </div>
            <div class="row" style="margin-top:12px;">
              <span class="muted">Try:</span>
              <button class="btn chip ex" disabled>Tell me a two-sentence bedtime story.</button>
              <button class="btn chip ex" disabled>Provide a brief history of the Internet.</button>
              <button class="btn chip ex" disabled>Read a calm note about the ocean.</button>
            </div>
            <div id="message" class="message"></div>
            <div class="hint">Press <b>Enter</b> to speak · <b>Shift</b>+<b>Enter</b> for a new line.</div>
          </div>
        </div>

        <!-- Right: stats + log -->
        <div class="card">
          <div class="cardHeader"><h2>Playback</h2></div>
          <div class="cardBody">
            <div class="metrics">
              <div class="metric"><div class="k">First Audio</div><div class="v" id="mLatency">— <span>s</span></div></div>
              <div class="metric"><div class="k">Audio Received</div><div class="v" id="mRecv">0.0 <span>s</span></div></div>
              <div class="metric"><div class="k">Buffered Ahead</div><div class="v" id="mBuf">0.00 <span>s</span></div></div>
              <div class="metric"><div class="k">Sample Rate</div><div class="v" id="mRate">— <span>Hz</span></div></div>
            </div>

            <div class="logHeader">
              <div class="muted">Event log</div>
              <div class="row">
                <button id="btnToggleLog" class="btn chip">Show</button>
                <button id="btnClearLog" class="btn chip">Clear</button>
              </div>
            </div>
            <div id="logWrap" class="logWrap"><pre id="log"></pre></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const stateEl = $("state"), stateDot = $("stateDot"), messageEl = $("message");
      const btnStart = $("btnStart"), btnSpeak = $("btnSpeak"), btnStop = $("btnStop");
      const promptEl = $("prompt");
      const exButtons = Array.from(document.querySelectorAll(".ex"));
      const mLatency = $("mLatency"), mRecv = $("mRecv"), mBuf = $("mBuf"), mRate = $("mRate");
      const logEl = $("log"), logWrap = $("logWrap"), btnToggleLog = $("btnToggleLog"), btnClearLog = $("btnClearLog");

      function setDot(m){ stateDot.classList.remove("ok","warn","bad","spk"); if(m) stateDot.classList.add(m); }
      function setState(t){ stateEl.textContent = t; }
      function setMessage(t, isError){ messageEl.textContent = t || ""; messageEl.className = "message" + (isError ? " error" : ""); }
      function log(...a){ const s = a.map(x => typeof x === "string" ? x : JSON.stringify(x)).join(" ");
        logEl.textContent += s + "\n"; logEl.scrollTop = logEl.scrollHeight; }

      // Event log is hidden by default; the stats above are always visible.
      let logOpen = false;
      function setLogOpen(o){ logOpen = o; logWrap.classList.toggle("open", o); btnToggleLog.textContent = o ? "Hide" : "Show"; }
      btnToggleLog.onclick = () => setLogOpen(!logOpen);
      btnClearLog.onclick = () => { logEl.textContent = ""; };

      // ---- Web Audio playback: schedule incoming PCM blocks back-to-back ----
      const player = {
        ctx: null, sampleRate: 24000, nextTime: 0, lead: 0.08, sources: [], receivedSamples: 0,
        ensureCtx(){
          if(!this.ctx){ this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
          if(this.ctx.state === "suspended"){ this.ctx.resume(); }
        },
        reset(){
          for(const s of this.sources){ try{ s.onended = null; s.stop(); }catch(e){} }
          this.sources = []; this.nextTime = 0; this.receivedSamples = 0;
        },
        push(f32){
          if(!f32 || f32.length === 0) return;
          this.ensureCtx();
          const buf = this.ctx.createBuffer(1, f32.length, this.sampleRate);
          buf.copyToChannel(f32, 0);
          const src = this.ctx.createBufferSource();
          src.buffer = buf; src.connect(this.ctx.destination);
          const now = this.ctx.currentTime;
          if(this.nextTime < now + 0.01) this.nextTime = now + this.lead;
          src.start(this.nextTime);
          this.nextTime += buf.duration;
          this.receivedSamples += f32.length;
          this.sources.push(src);
          src.onended = () => { const i = this.sources.indexOf(src); if(i>=0) this.sources.splice(i,1); };
        },
        bufferedSeconds(){ return this.ctx ? Math.max(0, this.nextTime - this.ctx.currentTime) : 0; },
      };

      // ---- WebSocket control ----
      let ws = null, ready = false;

      function setControls({connected=false, ready=false}={}){
        btnStart.disabled = !(connected && !ready);
        promptEl.disabled = !ready;
        btnSpeak.disabled = !ready;
        btnStop.disabled = !ready;
        exButtons.forEach(b => b.disabled = !ready);
      }

      function connect(){
        const proto = location.protocol === "https:" ? "wss" : "ws";
        ws = new WebSocket(`${proto}://${location.host}/ws`);
        ws.binaryType = "arraybuffer";
        ws.onopen = () => { setState("connecting…"); setDot("warn"); log("ws open"); };
        ws.onclose = () => {
          setState("disconnected"); setDot("bad"); ready = false; setControls({}); log("ws closed");
          if(!messageEl.classList.contains("error")) setMessage("Disconnected — reload the page to reconnect.");
        };
        ws.onerror = () => { setDot("bad"); log("ws error"); };
        ws.onmessage = (ev) => {
          if(ev.data instanceof ArrayBuffer){ player.push(new Float32Array(ev.data)); return; }
          let m; try{ m = JSON.parse(ev.data); }catch{ return; }
          handle(m);
        };
      }

      function handle(m){
        switch(m.type){
          case "connected":
            setState("ready to start"); setDot("ok"); setControls({connected:true});
            setMessage("Press Start to begin."); log("connected"); break;
          case "ready":
            ready = true; player.sampleRate = m.sample_rate || player.sampleRate;
            mRate.firstChild.textContent = player.sampleRate + " ";
            setState("ready"); setDot("ok"); setControls({ready:true});
            setMessage(""); promptEl.focus(); log("ready"); break;
          case "prompt_ack":
            setState("thinking…"); setDot("warn"); log("prompt submitted"); break;
          case "speaking":
            mLatency.firstChild.textContent = (m.first_audio_latency_s ?? "—") + " ";
            setState("speaking…"); setDot("spk"); log("speaking; first audio", m.first_audio_latency_s, "s"); break;
          case "done":
            setState("done — type another"); setDot("ok"); log("done"); break;
          case "error":
            setMessage(m.message || "Something went wrong.", true); setDot("bad"); setState("error");
            log("error:", m.message || "");
            if(!ready){ setControls({connected:true}); }   // allow retrying Start
            break;
          case "pong": break;
          default: log("msg", m);
        }
      }

      function sendStart(){
        if(!ws || ws.readyState !== 1) return;
        player.ensureCtx();                 // user gesture unlocks audio
        ws.send(JSON.stringify({cmd:"start"}));
        setState("starting…"); setDot("warn"); setMessage(""); btnStart.disabled = true; log("start");
      }

      function submitPrompt(){
        const text = (promptEl.value || "").trim();
        if(!text || !ready || !ws || ws.readyState !== 1) return;
        player.ensureCtx();
        player.reset();                     // flush any prior response
        mLatency.firstChild.textContent = "… ";
        ws.send(JSON.stringify({cmd:"prompt", text}));
        setState("thinking…"); setDot("warn"); log("speak:", text);
      }

      btnStart.onclick = sendStart;
      btnSpeak.onclick = submitPrompt;
      btnStop.onclick = () => { player.reset(); setState("stopped"); setDot("ok"); log("playback stopped"); };
      exButtons.forEach(b => b.onclick = () => { promptEl.value = b.textContent; submitPrompt(); });
      promptEl.addEventListener("keydown", (e) => {
        if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); submitPrompt(); }
      });

      // liveness ping + live stats
      setInterval(() => { if(ws && ws.readyState === 1) ws.send(JSON.stringify({cmd:"ping"})); }, 5000);
      setInterval(() => {
        mRecv.firstChild.textContent = (player.receivedSamples / Math.max(player.sampleRate,1)).toFixed(1) + " ";
        mBuf.firstChild.textContent = player.bufferedSeconds().toFixed(2) + " ";
      }, 200);

      connect();
    </script>
  </body>
</html>
