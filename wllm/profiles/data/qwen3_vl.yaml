# Qwen3-VL 8B.
#
# WITHDRAWN CLAIM (2026-07-27): this profile used to carry
# static_kv_cache as a measured EXACT optimization at 2.75x, on the
# grounds that "the single greedy flip sits at a top-2 logit gap of
# exactly 0.0 — arbitration, not divergence". Two jobs retired it.
#
# Job 202244 could not rule at all: the adjudicator crashed on this
# model's multimodal path, so the status was UNPROVEN and the claim came
# out pending evidence.
#
# Job 202503, with the adjudicator repaired and ruling on a census of
# positions rather than the first one, RULES AGAINST IT:
#   static_cache          83 of 128 positions disagree (64.8%)
#   static_cache_compile 111 of 128 positions disagree (86.7%)
#   verdict real_divergence, deciding gaps 0.25, 17.75, 22.25
#   (compile leg: 0.25, 27.625, 9.625) against epsilon 1e-3
# Gaps of 17-27 logits are not knife edges, and 83 disagreements are not
# "the single greedy flip". The current measurement does not merely fail
# to reproduce the original evidence, it contradicts its description;
# reconciling them would require re-running the original probe, which
# has not been done, so this file states what was measured and not why
# the earlier number looked the way it did.
#
# Status is therefore DISPROVEN under this workload and configuration,
# not merely unproven. Caveat recorded rather than buried: the decode
# replay is still unavailable on this model (a tensor-shape failure
# distinct from the one job 202244 hit), so both verdicts rest on the
# teacher-forced prefill path alone, which the tool disclosed in every
# line. That weakens confidence in a *benign* verdict; it does not
# rescue gaps of this size.
#
# Related and load-bearing (job 202328, a different model): the static
# cache alone is 0.87x — SLOWER — and the entire speedup attributed to
# it comes from a compiled forward that requesting the cache silently
# enables. So "static_kv_cache" was very likely never the name of the
# mechanism being measured here either.
#
# The rejection is recorded in the trace store dated 2026-07-27, which
# supersedes the 2026-07-24 acceptance by the store's latest-trace-wins
# rule rather than by rewriting history.
model_family: qwen3-vl
detection_ids:
  - Qwen/Qwen3-VL-8B-Instruct
  - "Qwen/Qwen3-VL-8B*"
components: [vision_encoder, language_model]
runtime_support:
  - runtime: wllm-serving
    tier: launchable
    evidence:
      - {kind: job_log, ref: "job 202244",
         note: "reference AR decode leg reproduces: 2683.5 ms for 128 new
                tokens (47.7 tok/s) on 1xH200, load 63s. Tier is back to
                launchable because no optimization currently holds a
                verdict for this model"}
      - {kind: report, ref: "docs/BETA_REPORT.md",
         note: "HISTORICAL, superseded: static KV cache measured 2.75x
                (2668 ms baseline) and was accepted as tie-aware exact
                under the prefill-only rule; see the withdrawal note at
                the top of this file"}
optimizations_lossless: []   # withdrawn 2026-07-27, see header
optimizations_bounded: []
incompatibilities: []
authenticity_signals:
  - kv_cache_active
validation:
  - token_parity_dual_path   # the gate the claim must now clear
binding:
  backend_version: "0.0.1a0"
  hardware: 1xH200
  cuda: ""
  last_validated: "2026-07-27"
  evidence_level: measured
