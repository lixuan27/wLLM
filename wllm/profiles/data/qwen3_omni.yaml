# Qwen3-Omni 30B-A3B — grounded in the onboarding smoke (job 202109), the
# AR-decode sweep (job 202214) and the cache-vs-compile split (job 202328).
#
# READ THIS BEFORE CONCLUDING "NOBODY TRIED": optimizations_lossless is
# empty because exact-quality sweeps RAN and every candidate was refused
# or left unproven — not because the question was never asked. The
# per-leg outcomes are in .wllm/traces/beta.jsonl under jobs 202214 and
# 202328.
#
# HEADLINE (job 202328) — THE 4.3x IS A MISATTRIBUTION IF CALLED A CACHE
# WIN. Requesting a static KV cache also puts generate() on an
# auto-compiled forward (the compile criterion fires for any compileable
# non-dynamic cache; default config is inductor with reduce-overhead,
# i.e. CUDA graphs). Suppressing that compile — proven by two independent
# signals, not by trusting a kwarg name — decomposes the speedup exactly:
#     static KV cache ALONE      0.873x @64, 0.876x @256  (SLOWER by ~13%)
#     compiled forward           4.719x @64
#     composition                4.117x @64
#     0.873 * 4.719 = 4.1175 vs composition 4.1173 — closes to 5e-4
# So the entire gain belongs to the compiled forward, which the registry
# already classifies as BOUNDED quality by prior measurement. The
# component named "static_kv_cache" is, on this runtime, a ~13 percent
# REGRESSION whose only other effect is to trigger the compile.
#
# TWO THINGS THIS FILE DELIBERATELY DOES NOT CLAIM:
# 1. The compiled path is NOT recorded as an exact win, even though the
#    trace store holds an accepted row for static_cache_autocompile at
#    64 tokens (4.117x, byte-identical tokens). That row is contradicted
#    by job 202214, where the SAME configuration diverged at 57 of 64
#    positions. The two runs differ in that 202214 omitted the CUDA-graph
#    step marker, so its tokens could have been read from reused graph
#    memory; that makes 202214's divergence suspect as a harness artifact
#    AND leaves the compiled path's output stability unreproduced across
#    processes. Unstable-across-runs is not exact.
# 2. Cache-alone exactness is established only at 64 tokens (tokens
#    byte-identical to the reference). At 256 tokens the verifier raised
#    inside the harness, so quality there is UNMEASURED, not refused.
#
# Second attribution caveat, unchanged: the runtime swaps the routed-
# expert kernel grouped_mm to batched_mm for the DECODE phase only and
# restores it after, so the config value describes prefill. That is why
# the batched_mm leg measured 1.00x with byte-identical tokens.
#
# SCOPE: measured on this 30B-A3B MoE thinker on 1xH200. The auto-compile
# mechanism lives in the framework generate() and so is generic, but
# these MAGNITUDES are not transferable — a dense model has a different
# launch-overhead-to-compute ratio than a sparse 30B-A3B whose batch-1
# decode is launch-bound. What generalizes is the mechanism and the
# misattribution risk; the numbers do not.
#
# Tier stays "launchable": nothing was promoted.
model_family: qwen3-omni
detection_ids:
  - Qwen/Qwen3-Omni-30B-A3B-Instruct
  - "Qwen/Qwen3-Omni-30B-A3B*"
components: [thinker_moe_lm, talker, audio_encoder, vision_encoder]
runtime_support:
  - runtime: torch-local
    tier: launchable
    evidence:
      - {kind: job_log, ref: "job 202109",
         note: "thinker-only text smoke: greedy 65 tokens at 24.2 tok/s
                median, load 123s, peak VRAM 65.7GB bf16 on 1xH200;
                talker disabled via disable_talker() and
                generate(return_audio=False) — the audio-out chain is
                UNMEASURED and not claimed here"}
      - {kind: job_log, ref: "job 202214",
         note: "AR decode sweep, single load, 80-token prompt, forced
                greedy lengths. Reference leg (declared bf16, dynamic
                cache): 2640 ms / 24.25 tok/s at 64 new tokens and
                9906 ms / 25.84 tok/s at 256, peak VRAM 59.3GB. Routed-
                expert kernel batched_mm was exact but 1.003x / 0.984x
                and +5.5GB peak, because it only changes prefill; eager
                was refused and 0.34x. KNOWN DEFECT of this run: it
                omitted the CUDA-graph step marker, so the token
                divergence it recorded for the static-cache leg may be a
                harness artifact rather than model numerics."}
      - {kind: job_log, ref: "job 202328",
         note: "cache-vs-compile split, single load, same prompt and
                forced lengths as 202214. Auto-compile suppression was
                PROVEN by two signals (no compiled callable was built,
                and the compiler counters did not move). Static KV cache
                ALONE: 2803 ms at 64 tokens and 11059 ms at 256, i.e.
                0.873x and 0.876x — SLOWER than the uncompiled dynamic-
                cache reference (2446 ms / 9692 ms), with tokens
                byte-identical to the reference at 64 tokens and quality
                UNMEASURED at 256 (the verifier raised inside the
                harness). Compiled forward alone: 4.719x. Composition:
                4.117x, and the decomposition multiplies back to within
                5e-4. Conclusion: the speedup is entirely the compiled
                forward, whose quality class is bounded, and the cache
                component is a ~13 percent regression. The 256-token
                compiled leg REFUSED TO LABEL ITSELF because it could not
                observe compilation, and is recorded as failed rather
                than as a number."}
optimizations_lossless: []   # measured empty (jobs 202214, 202328)
optimizations_bounded: []    # the compile that wins here has no measured
                             # quality budget on this model, and its
                             # output stability is unreproduced
incompatibilities: []
authenticity_signals:
  - path_notes_recorded
  - cache_class_recorded
  - experts_impl_recorded
  - compiled_callable_built_recorded
  - compiler_counter_delta_recorded
validation:
  - fixed_prompt_greedy_smoke
  - decode_token_parity_dual_path
  - autocompile_suppression_proven
binding:
  backend_version: "0.0.1a0"
  hardware: 1xH200
  cuda: ""
  last_validated: "2026-07-27"
  evidence_level: measured
