# Wan2.2 TI2V 5B — every claim traces to docs/BETA_REPORT.md or the
# job logs it names. No field here is aspirational.
model_family: wan2.2-ti2v
detection_ids:
  - Wan-AI/Wan2.2-TI2V-5B
  - "Wan-AI/Wan2.2-TI2V*"
components: [text_encoder, dit, vae]
runtime_support:
  - runtime: wllm-serving
    tier: optimized
    evidence:
      - {kind: job_log, ref: "job 196293",
         note: "2-GPU CFG branch parallel, 1.44x E2E, frame bit-exact"}
      - {kind: receipt, ref: ".wllm/receipts/wan22-cfg-branch-parallel-2gpu.json",
         note: "promotable receipt built from the same job"}
  - runtime: torch-local
    tier: parity-verified
    evidence:
      - {kind: job_log, ref: "job 196293",
         note: "sequential reference phase is the parity oracle"}
optimizations_lossless:
  - name: cfg_branch_parallel
    quality_class: exact
    evidence:
      - {kind: job_log, ref: "job 196293",
         note: "one CFG branch per GPU: frames max_abs 0 vs reference"}
    notes: "1.44x E2E on 2xH200; no cross-rank reductions"
optimizations_bounded:
  - name: torch_compile_max_autotune
    quality_class: bounded
    evidence:
      - {kind: report, ref: "docs/BETA_REPORT.md",
         note: "1.43x single-GPU but frame drift mean 7.4/255; refused by
                the exact gate — that refusal IS the bounded evidence"}
    notes: "bf16 fusion reordering drifts diffusion trajectories"
  - name: reuse_cache
    quality_class: bounded
    evidence:
      - {kind: job_log, ref: "job 202354",
         note: "50-step schedule, output-stability key, threshold 0.10,
                consecutive cap 2: 1.38x (9831 -> 7142 ms) reusing 14 of
                50 model evaluations, PSNR 32.0 dB against a declared
                30 dB budget, max_abs 229/255. The budget was declared in
                code before the run, not fitted to it"}
      - {kind: job_log, ref: "jobs 202206 and 202264",
         note: "the same technique has NO operating point at 20 steps:
                keying on input movement engages early and collapses the
                video (3.31x at PSNR 11.6 dB, refused), and the
                output-stability key never engages at all. Applicability
                is a schedule-length property — the observed per-step
                relative move starts at 0.009 over 50 steps versus 0.022
                over 20, so the finer schedule is what creates the
                redundancy this technique consumes"}
    notes: "only the output-stability key is admissible; keying on input
            movement is measured to engage exactly where reuse is unsafe"
# The batched-CFG divergence (max_abs 251/255) is recorded where it is
# enforceable: as a rejected optimization trace (see the trace seeds)
# and by cfg_batched's absence from the runtime's pass registry.
incompatibilities: []
authenticity_signals:
  - two_gpu_branch_execution
  - frame_parity_check_ran
validation:
  - frame_bitexact
  - e2e_latency
binding:
  backend_version: "0.0.1a0"
  hardware: 2xH200
  cuda: ""
  last_validated: "2026-07-25"
  evidence_level: measured
